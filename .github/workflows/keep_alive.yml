name: Keep Streamlit App Alive

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -sSL -o /dev/null -w "HTTP status: %{http_code}\n" --max-time 60 https://webtel-lead-generator.streamlit.app || true
